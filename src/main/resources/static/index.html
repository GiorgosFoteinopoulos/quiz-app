<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
<main class="card">
    <h1 id="title">Loading...</h1>
    <p id="status" class="status">Loading the scripts...</p>
    <button id="start-button" type="button" disabled>Start quiz</button>

    <section id="question-area" class="question-area" hidden>
        <div class="question-header">
            <p id="question-number" class="question-number"></p>
            <p id="timer" class="timer"></p>
        </div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="choices" class="choices"></div>
        <div class="question-actions">
            <button id="next-button" type="button" disabled>Next</button>
        </div>
    </section>

    <section id="result-area" class="result-area" hidden>
        <h2 id="score" class="score"></h2>
        <ol id="result-list" class="result-list"></ol>
    </section>
</main>
</body>
</html>
